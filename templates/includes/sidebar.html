<style>
    /* Стилі для кастомних навігаційних елементів */
    .nav-item-custom {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        border-left: 3px solid transparent;
    }
    
    .nav-item-custom:hover {
        background-color: rgba(255, 255, 255, 0.05) !important;
        color: #fff !important;
        border-left-color: #ffc107;
        padding-left: 1.5rem;
    }
    
    .nav-item-custom:hover i {
        color: #ffc107 !important;
        transform: scale(1.1);
    }

    .nav-item-custom i {
        transition: all 0.2s ease;
    }

    /* Ховер для тегів у правому блоці */
    .tag-item-custom:hover {
        background-color: #212529 !important;
        border-color: #ffc107 !important;
    }
</style>

<div class="card bg-black border-secondary mb-4 shadow-sm">
    <div class="card-header bg-dark border-secondary">
        <h6 class="mb-0 text-light"><i class="bi bi-compass text-warning me-2"></i> Навігація</h6>
    </div>
    <div class="card-body p-0">
        <div class="list-group list-group-flush">
            <a href="{% url 'core:home' %}" class="list-group-item list-group-item-action bg-black text-light border-secondary d-flex align-items-center nav-item-custom py-3">
                <i class="bi bi-house-door me-3 text-secondary fs-5"></i> Головна
            </a>
            <a href="{% url 'core:post_list' %}" class="list-group-item list-group-item-action bg-black text-light border-secondary d-flex align-items-center nav-item-custom py-3">
                <i class="bi bi-card-text me-3 text-secondary fs-5"></i> Всі пости
            </a>
            <a href="{% url 'core:category_list' %}" class="list-group-item list-group-item-action bg-black text-light border-secondary d-flex align-items-center nav-item-custom py-3">
                <i class="bi bi-reddit me-3 text-secondary fs-5"></i> Спільноти
            </a>
            <a href="{% url 'core:tag_list' %}" class="list-group-item list-group-item-action bg-black text-light border-secondary d-flex align-items-center nav-item-custom py-3">
                <i class="bi bi-tags me-3 text-secondary fs-5"></i> Теги
            </a>
        </div>
    </div>
</div>

<div class="card bg-black border-secondary mb-4 shadow-sm">
    <div class="card-header bg-dark border-secondary">
        <h6 class="mb-0 text-light"><i class="bi bi-collection text-warning me-2"></i> Спільноти</h6>
    </div>
    <div class="card-body">
        <a href="{% url 'core:category_list' %}" class="btn btn-outline-warning w-100 fw-bold rounded-pill">
            <i class="bi bi-eye me-2"></i> Переглянути всі
        </a>
    </div>
</div>

<div class="card bg-black border-secondary">
    <div class="card-header bg-black border-secondary border-bottom-0 pt-3 pb-0">
        <h5 class="mb-0 text-light fw-bold">
            <i class="bi bi-tags text-warning me-2"></i> Популярні теги
        </h5>
    </div>
    <div class="card-body pt-3">
        <div class="d-flex flex-wrap gap-2">
            {% for tag in popular_tags %}
            <a href="{% url 'core:tag_detail' tag.slug %}" class="text-decoration-none border border-secondary text-light bg-black rounded px-3 py-1 d-inline-flex align-items-center tag-item-custom transition-all">
                <span class="text-info fw-bold me-1">#</span>{{ tag.name }} 
                <span class="badge bg-secondary ms-2 rounded text-light px-2">{{ tag.post_count }}</span>
            </a>
            {% empty %}
            <p class="text-muted small w-100 text-center mt-2">Тегів ще немає</p>
            {% endfor %}
        </div>
    </div>
</div>
