{% extends 'base.html' %}

{% block title %}Підтвердження видалення - Мій Блог{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-black border-danger">
            <div class="card-header bg-dark border-danger">
                <h4 class="text-light mb-0">
                    <i class="bi bi-trash text-danger"></i> Підтвердження видалення
                </h4>
            </div>
            <div class="card-body">
                <p class="text-light fs-5">
                    Ви впевнені, що хочете назавжди видалити пост:
                </p>
                
                <div class="alert alert-dark border-secondary">
                    <h5 class="text-light mb-0">"{{ object.title }}"</h5>
                </div>
                
                <p class="text-muted">
                    Цю дію неможливо буде скасувати.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary">
                        <button type="submit" class="btn btn-danger btn-lg">
                            <i class="bi bi-trash"></i> Так, видалити
                        </button>
                        <a href="{{ object.get_absolute_url }}" class="btn btn-outline-light">
                            <i class="bi bi-x"></i> Скасувати
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
