{% if active_ads %}
<div class="card bg-black border-secondary mb-4">
    <div class="card-body">
        <h5 class="text-light mb-3">
            <i class="bi bi-megaphone text-warning"></i> Оголошення
        </h5>
        {% for ad in active_ads %}
        <div class="card bg-dark border-secondary mb-2">
            {% if ad.image %}
                <a href="{{ ad.link|default:"#" }}" target="_blank" rel="noopener noreferrer">
                    <img src="{{ ad.image.url }}" class="card-img-top" alt="{{ ad.title }}">
                </a>
            {% endif %}
            <div class="card-body">
                <h6 class="text-light mb-1">{{ ad.title }}</h6>
                <p class="text-muted small mb-2">{{ ad.content|truncatewords:15 }}</p>
                <a href="{{ ad.link|default:"#" }}" class="btn btn-outline-warning btn-sm" target="_blank" rel="noopener noreferrer">
                    Дізнатися більше
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
