{% extends 'base.html' %}

{% block title %}Редагування даних - Мій Блог{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <!-- Заголовок -->
        <div class="card bg-black border-secondary mb-4">
            <div class="card-body">
                <h4 class="text-light mb-0">
                    <i class="bi bi-person text-warning"></i> Редагування даних користувача
                </h4>
            </div>
        </div>

        <!-- Форма -->
        <div class="card bg-black border-secondary">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <!-- Ім'я -->
                    <div class="mb-4">
                        <label class="form-label text-light">Ім'я</label>
                        <input type="text" name="first_name" class="form-control bg-dark border-secondary text-light" value="{{ form.first_name.value|default:'' }}">
                    </div>

                    <!-- Прізвище -->
                    <div class="mb-4">
                        <label class="form-label text-light">Прізвище</label>
                        <input type="text" name="last_name" class="form-control bg-dark border-secondary text-light" value="{{ form.last_name.value|default:'' }}">
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label class="form-label text-light">Email</label>
                        <input type="email" name="email" class="form-control bg-dark border-secondary text-light" value="{{ form.email.value|default:'' }}">
                    </div>

                    <!-- Кнопки -->
                    <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check"></i> Зберегти зміни
                        </button>
                        <a href="{% url 'users:profile_detail' username=user.username %}" class="btn btn-outline-light">
                            <i class="bi bi-x"></i> Скасувати
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
